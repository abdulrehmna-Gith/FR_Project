apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      volumes:
        - name: data
          hostPath:
            path: /qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  type: NodePort
  selector: {app: qdrant}
  ports:
    - port: 6333
      targetPort: 6333
      nodePort: 30333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
spec:
  replicas: 1
  selector:
    matchLabels: {app: triton}
  template:
    metadata:
      labels: {app: triton}
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:25.12-py3
          imagePullPolicy: IfNotPresent
          command: ["tritonserver", "--model-repository=/models"]
          ports:
            - containerPort: 8000
            - containerPort: 8001
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: triton
spec:
  type: NodePort
  selector: {app: triton}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30000
    - name: grpc
      port: 8001
      targetPort: 8001
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: face-app}
  template:
    metadata:
      labels: {app: face-app}
    spec:
      containers:
        - name: face-app
          image: face-app:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TRITON_URL
              value: "triton:8000"
            - name: QDRANT_URL
              value: "http://qdrant:6333"
---
apiVersion: v1
kind: Service
metadata:
  name: face-app
spec:
  type: NodePort
  selector: {app: face-app}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
